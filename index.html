<!DOCTYPE html>
<html lang="en" data-theme="tui">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080d09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>plan - Mobile TUI Todo Manager</title>
  <!-- Samaano & JetBrains Mono Fonts for TUI aesthetic -->
  <link rel="preload" href="fonts/Samaano-VF.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300ff66' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M8 7v7'/><path d='M12 7v4'/><path d='M16 7v9'/></svg>" />
  <!-- Lucide Icons. Pinned: "latest" could swap the icon set under the app. -->
  <script src="https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js"
          integrity="sha384-Hh7C333mXel+qppGoFs4qAOXp7h67eur4XsQVF2bvHAM3MQ4DX4cQI7oRCzb98J4"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

  <div class="mobile-app-shell">
    <!-- Top App Navigation / Header (Ultra Clean & Minimalist) -->
    <header class="app-header">
      <div class="header-left">
        <div class="app-logo" title="plan"><i data-lucide="check-circle-2"></i> <span>plan</span></div>
      </div>

      <div class="header-right">
        <!-- Notification Countdown Indicator -->
        <div id="header-notif-countdown" class="header-countdown-badge hidden" title="Time until next reminder alert">
          <i data-lucide="bell"></i>
          <span id="countdown-timer-text">--:--</span>
        </div>

        <!-- Settings -->
        <button id="btn-open-settings" class="icon-btn primary-header-btn" title="Settings & Tools">
          <i data-lucide="settings"></i> <span>Settings</span>
        </button>
      </div>
    </header>

    <!-- Main Kanban Board Container -->
    <main class="board-container" id="board">
      <!-- Dynamic lists will be rendered here -->
      
      <!-- Add New List Column Action -->
      <div class="add-list-wrapper" id="add-list-wrapper">
        <form id="add-list-form" class="add-list-form">
          <input type="text" id="new-list-title" class="new-list-input" placeholder="+ Add another list... (press Enter)" autocomplete="off" />
          <button type="submit" id="btn-add-list"><i data-lucide="plus"></i> Add List</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Settings & Tools Modal -->
  <div class="modal-overlay hidden" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="modal-card" style="max-width: 500px;">
      <div class="modal-header">
        <h3 id="settings-modal-title"><i data-lucide="settings"></i> Settings & Backup</h3>
        <button type="button" class="modal-close" id="settings-close-btn" data-modal-close aria-label="Close settings">&times;</button>
      </div>

      <div class="modal-body">
        <!-- Boards Management Section -->
        <div class="modal-section" id="settings-boards-section">
          <h4><i data-lucide="layout-grid"></i> Boards</h4>
          <p class="settings-section-hint">
            Switch boards or create and manage separate projects.
          </p>

          <div class="board-manager-card">
            <div class="board-select-row">
              <label for="board-select" class="board-select-label">Active Board:</label>
              <div class="board-select-field">
                <select id="board-select" class="board-select" aria-label="Select Board"></select>
                <i data-lucide="chevron-down" class="board-select-chevron"></i>
              </div>
            </div>

            <div class="board-actions-toolbar">
              <button type="button" id="btn-new-board" class="board-action-btn btn-board-new" title="Create New Board">
                <i data-lucide="plus"></i> <span>New</span>
              </button>
              <button type="button" id="btn-rename-board" class="board-action-btn btn-board-rename" title="Rename Board">
                <i data-lucide="pencil"></i> <span>Rename</span>
              </button>
              <button type="button" id="btn-del-board" class="board-action-btn btn-board-delete" title="Delete Current Board">
                <i data-lucide="trash-2"></i> <span>Delete</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Notifications Configuration Section -->
        <div class="modal-section" id="settings-notifications-section">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <h4 style="margin: 0;"><i data-lucide="bell"></i> Notifications</h4>
            <label class="switch-toggle" title="Enable or disable notifications">
              <input type="checkbox" id="notif-toggle-master" />
              <span class="switch-slider"></span>
            </label>
          </div>

          <div class="notif-status-row">
            <span class="notif-status-label">Permission:</span>
            <span class="notif-perm-badge" id="notif-perm-badge">Checking...</span>
            <button type="button" id="btn-notif-req-perm" class="icon-btn-sm" style="display: none; margin-left: auto;">
              <i data-lucide="shield-alert"></i> Request Permission
            </button>
            <button type="button" id="btn-notif-test" class="icon-btn-sm" style="margin-left: auto;">
              <i data-lucide="send"></i> Test Alert
            </button>
          </div>

        </div>

        <!-- Data Backup & Restore & Exports -->
        <div class="modal-section">
          <h4><i data-lucide="file-output"></i> Backup & Export</h4>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
            <button id="btn-export-json" class="icon-btn" style="background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border-color);">
              <i data-lucide="download"></i> Export JSON
            </button>

            <label class="icon-btn" style="background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border-color); cursor: pointer;">
              <i data-lucide="upload"></i> Import JSON
              <input type="file" id="import-file-input" accept=".json" style="display: none;" />
            </label>
          </div>
        </div>

        <!-- Board Reset -->
        <div class="modal-section" style="border-top: 1px solid var(--border-color); padding-top: 12px;">
          <h4><i data-lucide="alert-triangle"></i> Reset Board</h4>
          <div style="margin-top: 8px;">
            <button id="btn-reset-board" class="btn-danger">
              <i data-lucide="rotate-ccw"></i> Reset Board to Default
            </button>
          </div>
        </div>
      </div>

      <div class="modal-footer" style="padding: 12px 16px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; background: var(--header-bg);">
        <button type="button" class="icon-btn primary-header-btn" data-modal-close style="padding: 6px 18px; cursor: pointer;">
          <i data-lucide="check"></i> <span>Done</span>
        </button>
      </div>
    </div>
  </div>


  <!-- Priority Picker (opened by a list's + button once a title is typed) -->
  <div class="modal-overlay hidden" id="add-card-modal" role="dialog" aria-modal="true" aria-labelledby="add-card-modal-title">
    <div class="modal-card" style="max-width: 360px;">
      <div class="modal-header">
        <h3 id="add-card-modal-title"><i data-lucide="flag"></i> Priority</h3>
        <button type="button" class="modal-close" id="add-card-close-btn" data-modal-close aria-label="Close priority picker">&times;</button>
      </div>

      <div class="modal-body">
        <div class="modal-section" style="border: none; margin-bottom: 0; padding: 0;">
          <p class="settings-hint-text" style="margin-bottom: 10px;">
            Add &ldquo;<span id="add-card-title-preview"></span>&rdquo; to
            <strong id="add-card-list-name">&mdash;</strong> with priority:
          </p>
          <div class="priority-selector" id="add-card-priority-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Move Card Modal -->
  <div class="modal-overlay hidden" id="move-card-modal" role="dialog" aria-modal="true" aria-labelledby="move-card-modal-title">
    <div class="modal-card" style="max-width: 360px;">
      <div class="modal-header">
        <h3 id="move-card-modal-title"><i data-lucide="arrow-right-left"></i> Move Todo</h3>
        <button type="button" class="modal-close" id="move-card-close-btn" data-modal-close aria-label="Close move picker">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-section" style="border: none; margin-bottom: 0; padding: 0;">
          <p class="settings-hint-text" style="margin-bottom: 12px;">
            Move &ldquo;<span id="move-card-title-preview"></span>&rdquo; to:
          </p>
          <div id="move-card-list-options" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Reminder rules + IndexedDB access. These are CLASSIC scripts, not modules:
       the service worker loads the very same files with importScripts(), which
       is what lets reminders fire while this tab is closed. They must stay
       before the module below. -->
  <script src="js/reminder-core.js"></script>
  <script src="js/plan-store.js"></script>

  <!-- Main JavaScript App Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
